    // Polyfill defensivo para canvas.roundRect
    if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, radii) {
        if (!Array.isArray(radii)) radii = [radii || 0];
        const r = radii[0] || 0;
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
      };
    }

    // --- EFECTOS DE SONIDO SINTETIZADOS ---
    const SoundFX = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      },
      playPop() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(460, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch (e) {}
      },
      playJump() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(280, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(620, this.ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.15);
        } catch (e) {}
      },
      playSuccess() {
        try {
          this.init();
          if (!this.ctx) return;
          const notes = [440, 554.37, 659.25, 880];
          notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.value = freq;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.18, this.ctx.currentTime + i * 0.07);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.07 + 0.18);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + i * 0.07);
            osc.stop(this.ctx.currentTime + i * 0.07 + 0.2);
          });
        } catch (e) {}
      },
      playScore() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, this.ctx.currentTime);
          osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.06);
          gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.18);
        } catch (e) {}
      }
    };

    // --- LIENZO DE DIBUJO ---
    const MiniCanvasPainter = ({ onSave, onCancel }) => {
      const canvasRef = React.useRef(null);
      const [isDrawing, setIsDrawing] = React.useState(false);
      const [brushColor, setBrushColor] = React.useState('#ec4899');
      const [brushSize, setBrushSize] = React.useState(7);
      const [title, setTitle] = React.useState('');
      const [description, setDescription] = React.useState('');
      const [validationError, setValidationError] = React.useState('');

      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }, []);

      const getPos = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches && e.touches[0] ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : null);
        const clientX = touch ? touch.clientX : e.clientX;
        const clientY = touch ? touch.clientY : e.clientY;
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      };

      const startDraw = (e) => {
        e.preventDefault();
        SoundFX.playPop();
        setIsDrawing(true);
        const { x, y } = getPos(e);
        const ctx = canvasRef.current.getContext('2d');
        ctx.beginPath();
        ctx.moveTo(x, y);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        e.preventDefault();
        const { x, y } = getPos(e);
        const ctx = canvasRef.current.getContext('2d');
        ctx.lineTo(x, y);
        ctx.strokeStyle = brushColor;
        ctx.lineWidth = brushSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      };

      const stopDraw = () => setIsDrawing(false);

      const clearCanvas = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        SoundFX.playPop();
      };

      const handleConfirm = () => {
        if (!title.trim()) {
          setValidationError('Por favor escribe el título de tu obra antes de enviarla');
          return;
        }
        setValidationError('');
        const dataUrl = canvasRef.current.toDataURL('image/jpeg', 0.82);
        SoundFX.playSuccess();
        onSave({ title, description, imageUrl: dataUrl });
      };

      return (
        <div className="bg-white rounded-3xl p-5 shadow-2xl border-4 border-purple-200 max-w-lg w-full mx-auto">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-xl font-bold text-purple-700 flex items-center gap-2">
              <span>🎨</span> Taller de Dibujo
            </h3>
            <button onClick={onCancel} className="text-slate-400 hover:text-slate-600 p-1 text-xl">✕</button>
          </div>

          <div className="border-4 border-dashed border-purple-200 rounded-2xl overflow-hidden bg-white shadow-inner flex justify-center items-center touch-none">
            <canvas
              ref={canvasRef}
              width={450}
              height={320}
              className="w-full h-auto cursor-crosshair bg-white"
              onMouseDown={startDraw}
              onMouseMove={draw}
              onMouseUp={stopDraw}
              onMouseLeave={stopDraw}
              onTouchStart={startDraw}
              onTouchMove={draw}
              onTouchEnd={stopDraw}
            />
          </div>

          <div className="flex items-center justify-between gap-2 mt-4 flex-wrap">
            <div className="flex items-center gap-2">
              {['#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#1f2937'].map((c) => (
                <button
                  key={c}
                  onClick={() => setBrushColor(c)}
                  className={`w-7 h-7 rounded-full border-2 border-white shadow-md ${brushColor === c ? 'scale-125 ring-2 ring-purple-500' : 'hover:scale-110'}`}
                  style={{ backgroundColor: c }}
                />
              ))}
            </div>
            <div className="flex items-center gap-2">
              <button onClick={() => setBrushSize(4)} className={`px-2 py-1 rounded-lg text-xs font-bold ${brushSize === 4 ? 'bg-purple-100 text-purple-700 border border-purple-300' : 'bg-slate-100'}`}>Fino</button>
              <button onClick={() => setBrushSize(8)} className={`px-2 py-1 rounded-lg text-xs font-bold ${brushSize === 8 ? 'bg-purple-100 text-purple-700 border border-purple-300' : 'bg-slate-100'}`}>Medio</button>
              <button onClick={() => setBrushSize(18)} className={`px-2 py-1 rounded-lg text-xs font-bold ${brushSize === 18 ? 'bg-purple-100 text-purple-700 border border-purple-300' : 'bg-slate-100'}`}>Grueso</button>
              <button onClick={clearCanvas} className="px-2 py-1 bg-red-100 text-red-600 rounded-lg text-xs font-bold hover:bg-red-200">Borrar</button>
            </div>
          </div>

          <div className="mt-4 space-y-2">
            <input
              type="text"
              placeholder="Título de tu obra..."
              value={title}
              onChange={(e) => {
                setTitle(e.target.value);
                if (validationError) setValidationError('');
              }}
              className="w-full px-4 py-2 rounded-xl border border-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-400 text-sm font-semibold"

            <textarea

              placeholder="Descripción o dedicatoria..."

            {validationError && (
              <p className="text-red-500 font-bold text-xs">{validationError}</p>
            )}
          </div>

          <div className="mt-4 flex gap-2 justify-end">
            <button onClick={onCancel} className="px-4 py-2 rounded-xl bg-slate-200 font-bold text-slate-700 text-sm">Cancelar</button>
            <button onClick={handleConfirm} className="px-5 py-2 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold text-sm shadow-lg">
              Enviar a Supervisión
            </button>
          </div>
        </div>
      );
    };

    // --- FLAPPY UNICORN A PANTALLA COMPLETA ---
    const FullscreenFlappyUnicorn = ({ currentUser, leaderboard, onUpdateScore, onClose }) => {
      const canvasRef = React.useRef(null);
      const [score, setScore] = React.useState(0);
      const [highScore, setHighScore] = React.useState(
        leaderboard.find(l => l.userId === currentUser?.id)?.score || 0
      );

      const stateRef = React.useRef({
        unicorn: { y: 220, vy: 0, rot: 0 },
        pipes: [],
        stars: [],
        particles: [],
        frameCount: 0,
        currentScore: 0,
        status: 'ready'
      });

      const jump = () => {
        const s = stateRef.current;
        if (s.status === 'ready') {
          s.status = 'playing';
          s.unicorn = { y: 240, vy: -5.8, rot: -0.25 };
          s.pipes = [];
          s.particles = [];
          s.currentScore = 0;
          setScore(0);
          SoundFX.playJump();
          return;
        }
        if (s.status === 'playing') {
          s.unicorn.vy = -5.8;
          SoundFX.playJump();
          for (let i = 0; i < 7; i++) {
            s.particles.push({
              x: 100,
              y: s.unicorn.y + 10,
              vx: -(Math.random() * 2.8 + 1),
              vy: (Math.random() - 0.5) * 3.5,
              alpha: 1,
              color: ['#f472b6', '#c084fc', '#fde047', '#38bdf8', '#ffffff'][Math.floor(Math.random() * 5)],
              size: Math.random() * 5 + 3
            });
          }
        } else if (s.status === 'gameover') {
          s.status = 'ready';
          SoundFX.playPop();
        }
      };

      React.useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.code === 'Space') {
            e.preventDefault();
            jump();
          } else if (e.code === 'Escape') {
            onClose();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        const bgStars = [];
        for (let i = 0; i < 40; i++) {
          bgStars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 3 + 1.2,
            speed: Math.random() * 0.5 + 0.2
          });
        }
        stateRef.current.stars = bgStars;

        const loop = () => {
          const s = stateRef.current;
          s.frameCount++;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
          skyGrad.addColorStop(0, '#3b0764');
          skyGrad.addColorStop(0.4, '#6b21a8');
          skyGrad.addColorStop(0.8, '#be185d');
          skyGrad.addColorStop(1, '#f43f5e');
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#ffffff';
          s.stars.forEach(st => {
            if (s.status === 'playing') {
              st.x -= st.speed;
              if (st.x < 0) st.x = canvas.width;
            }
            ctx.globalAlpha = 0.8;
            ctx.beginPath();
            ctx.arc(st.x, st.y, st.size, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.globalAlpha = 1.0;

          if (s.status === 'playing') {
            s.unicorn.vy += 0.22;
            s.unicorn.y += s.unicorn.vy;
            s.unicorn.rot = Math.min(Math.PI / 5, Math.max(-Math.PI / 5, s.unicorn.vy * 0.05));

            if (s.frameCount % 110 === 0) {
              const gap = 260;
              const minPipe = 40;
              const maxPipe = Math.max(minPipe + 20, canvas.height - gap - minPipe - 55);
              const topH = Math.floor(Math.random() * (maxPipe - minPipe + 1)) + minPipe;
              s.pipes.push({
                x: canvas.width,
                top: topH,
                bottom: canvas.height - topH - gap,
                passed: false
              });
            }

            const uX = 100;
            const uY = s.unicorn.y;
            const uRadius = 18;

            for (let i = s.pipes.length - 1; i >= 0; i--) {
              const p = s.pipes[i];
              p.x -= 2.1;

              if (!p.passed && p.x + 65 < uX) {
                p.passed = true;
                s.currentScore += 1;
                setScore(s.currentScore);
                SoundFX.playScore();
                if (s.currentScore > highScore) {
                  setHighScore(s.currentScore);
                  if (currentUser) onUpdateScore(s.currentScore);
                }
              }

              if (uX + uRadius > p.x && uX - uRadius < p.x + 65) {
                if (uY - uRadius < p.top || uY + uRadius > canvas.height - p.bottom) {
                  s.status = 'gameover';
                  if (currentUser) onUpdateScore(s.currentScore);
                }
              }

              if (p.x < -80) {
                s.pipes.splice(i, 1);
              }
            }

            if (s.unicorn.y > canvas.height - 35 || s.unicorn.y < 20) {
              s.status = 'gameover';
              if (currentUser) onUpdateScore(s.currentScore);
            }
          }

          s.pipes.forEach(p => {
            const grad = ctx.createLinearGradient(p.x, 0, p.x + 65, 0);
            grad.addColorStop(0, '#f43f5e');
            grad.addColorStop(0.3, '#fbbf24');
            grad.addColorStop(0.7, '#38bdf8');
            grad.addColorStop(1, '#a855f7');
            ctx.fillStyle = grad;

            if (ctx.roundRect) {
              ctx.beginPath();
              ctx.roundRect(p.x, 0, 65, p.top, [0, 0, 16, 16]);
              ctx.fill();

              const bY = canvas.height - p.bottom;
              ctx.beginPath();
              ctx.roundRect(p.x, bY, 65, p.bottom, [16, 16, 0, 0]);
              ctx.fill();
            } else {
              ctx.fillRect(p.x, 0, 65, p.top);
              ctx.fillRect(p.x, canvas.height - p.bottom, 65, p.bottom);
            }

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(p.x + 16, p.top, 14, 0, Math.PI * 2);
            ctx.arc(p.x + 33, p.top + 3, 16, 0, Math.PI * 2);
            ctx.arc(p.x + 50, p.top, 14, 0, Math.PI * 2);
            ctx.fill();

            const bY = canvas.height - p.bottom;
            ctx.beginPath();
            ctx.arc(p.x + 16, bY, 14, 0, Math.PI * 2);
            ctx.arc(p.x + 33, bY - 3, 16, 0, Math.PI * 2);
            ctx.arc(p.x + 50, bY, 14, 0, Math.PI * 2);
            ctx.fill();
          });

          for (let i = s.particles.length - 1; i >= 0; i--) {
            const pt = s.particles[i];
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.alpha -= 0.025;
            if (pt.alpha <= 0) {
              s.particles.splice(i, 1);
              continue;
            }
            ctx.save();
            ctx.globalAlpha = pt.alpha;
            ctx.fillStyle = pt.color;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          ctx.save();
          const uniY = s.status === 'ready' ? 240 + Math.sin(s.frameCount * 0.08) * 10 : s.unicorn.y;
          ctx.translate(100, uniY);
          ctx.rotate(s.status === 'ready' ? 0 : s.unicorn.rot);

          ctx.fillStyle = '#c084fc';
          ctx.beginPath();
          ctx.ellipse(0, 0, 24, 18, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.beginPath();
          ctx.ellipse(16, -9, 13, 13, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fde047';
          ctx.beginPath();
          ctx.moveTo(22, -16);
          ctx.lineTo(36, -30);
          ctx.lineTo(28, -14);
          ctx.fill();

          ctx.fillStyle = '#1e1b4b';
          ctx.beginPath();
          ctx.arc(20, -10, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(21, -11, 1.2, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#f472b6';
          const wing = Math.sin(s.frameCount * 0.38) * 0.45;
          ctx.save();
          ctx.translate(-2, 0);
          ctx.rotate(wing);
          ctx.beginPath();
          ctx.ellipse(-8, -4, 14, 8, -0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.fillStyle = '#ec4899';
          ctx.beginPath();
          ctx.arc(-22, 2, 7, 0, Math.PI * 2);
          ctx.arc(-24, 9, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.fillStyle = '#22c55e';
          ctx.fillRect(0, canvas.height - 24, canvas.width, 24);
          ctx.fillStyle = '#16a34a';
          ctx.fillRect(0, canvas.height - 24, canvas.width, 6);

          if (s.status === 'ready') {
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px Fredoka, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('¡TOCA LA PANTALLA O PULSA ESPACIO!', canvas.width / 2, canvas.height / 2 + 50);
          } else if (s.status === 'gameover') {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 32px Fredoka, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('¡INTÉNTALO OTRA VEZ! 🦄', canvas.width / 2, canvas.height / 2 - 25);
            ctx.font = 'bold 22px Fredoka, sans-serif';
            ctx.fillStyle = '#fde047';
            ctx.fillText(`Puntuación: ${s.currentScore}`, canvas.width / 2, canvas.height / 2 + 15);
            ctx.font = '16px Quicksand, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('Toca la pantalla para reiniciar el vuelo', canvas.width / 2, canvas.height / 2 + 55);
          }

          animId = requestAnimationFrame(loop);
        };

        animId = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(animId);
      }, [highScore, currentUser]);

      return (
        <div className="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center select-none touch-none">
          <div className="absolute top-4 left-4 right-4 z-10 flex items-center justify-between text-white pointer-events-auto">
            <button
              onClick={onClose}
              className="px-4 py-2 bg-white/20 hover:bg-white/30 backdrop-blur-md rounded-2xl font-bold text-sm flex items-center gap-1.5 shadow-lg"
            >
              <span>⬅️</span> Volver
            </button>
            <div className="flex items-center gap-3">
              <div className="bg-purple-900/80 backdrop-blur-md px-4 py-1.5 rounded-2xl border border-purple-400/40 text-center">
                <span className="text-[10px] uppercase font-bold text-purple-200 block">Puntos</span>
                <span className="text-2xl font-black text-white">{score}</span>
              </div>
              <div className="bg-amber-900/80 backdrop-blur-md px-4 py-1.5 rounded-2xl border border-amber-400/40 text-center">
                <span className="text-[10px] uppercase font-bold text-amber-200 block">Récord</span>
                <span className="text-2xl font-black text-amber-300">{highScore}</span>
              </div>
            </div>
          </div>

          <div onClick={jump} className="w-full h-full cursor-pointer relative flex items-center justify-center">
            <canvas
              ref={canvasRef}
              width={window.innerWidth > 900 ? 900 : 480}
              height={window.innerHeight > 650 ? 650 : 560}
              className="w-full h-full object-cover block"
            />
          </div>

          <div className="absolute bottom-6 left-0 right-0 flex justify-center pointer-events-auto px-4">
            <button
              onClick={jump}
              className="w-full max-w-md py-4 rounded-3xl bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 text-white font-extrabold text-xl shadow-2xl active:scale-95 transition"
            >
              ¡TOCA AQUÍ PARA SALTAR! 🪽
            </button>
          </div>
        </div>
      );
    };

    // --- COMPONENTE PRINCIPAL ---
    function App() {
      const [users, setUsers] = React.useState([]);
      const [activeTab, setActiveTab] = React.useState('chats');
      const [posts, setPosts] = React.useState([]);
      const [chats, setChats] = React.useState([]);
      const [leaderboard, setLeaderboard] = React.useState([]);
      const [parentPendingQueue, setParentPendingQueue] = React.useState([]);
      const [isLoading, setIsLoading] = React.useState(true);
      const [firebaseUser, setFirebaseUser] = React.useState(null);
      const [currentUserProfile, setCurrentUserProfile] = React.useState(null);

      // Estados de Login
      const [rawUsernameInput, setRawUsernameInput] = React.useState('');
      const [loginPasswordInput, setLoginPasswordInput] = React.useState('');
      const [showLoginPassword, setShowLoginPassword] = React.useState(false);
      const [loginError, setLoginError] = React.useState('');
      const [isAuthenticating, setIsAuthenticating] = React.useState(false);

      // Entradas de comentarios del museo
      const [commentInputs, setCommentInputs] = React.useState({});

      // Chat y notas de voz
      const [selectedChatId, setSelectedChatId] = React.useState(null);
      const [messageInput, setMessageInput] = React.useState('');
      const [isRecordingAudio, setIsRecordingAudio] = React.useState(false);
      const [recordingSeconds, setRecordingSeconds] = React.useState(0);
      const recordTimerRef = React.useRef(null);
      const mediaRecorderRef = React.useRef(null);
      const audioChunksRef = React.useRef([]);

      // Notificaciones Toast globales
      const [toastNotification, setToastNotification] = React.useState(null);
      const toastTimerRef = React.useRef(null);

      const triggerToast = (message, icon = '✨') => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        setToastNotification({ message, icon });
        toastTimerRef.current = setTimeout(() => {
          setToastNotification(null);
        }, 4000);
      };

      // Modales
      const [showPainter, setShowPainter] = React.useState(false);
      const [showRequestChatModal, setShowRequestChatModal] = React.useState(false);
      const [requestChatTarget, setRequestChatTarget] = React.useState('');
      const [showAddMemberModal, setShowAddMemberModal] = React.useState(false);
      const [modalError, setModalError] = React.useState('');
      const [showFullscreenGame, setShowFullscreenGame] = React.useState(false);

      // Formulario para crear nuevo miembro
      const [newMemberForm, setNewMemberForm] = React.useState({
        name: '',
        rawUsername: '',
        password: '',
        role: 'parent',
        userIcon: '🛡️',
        theme: 'unicorns',
        relation: ''
      });

      // --- ESCUCHADOR DE SESIÓN ACTIVA ---
      React.useEffect(() => {
        if (!auth) {
          setIsLoading(false);
          return;
        }

        const unsubAuth = auth.onAuthStateChanged(async (user) => {
          setFirebaseUser(user);
          if (user && db) {
            try {
              const docSnap = await db.collection('users').doc(user.uid).get();
              if (docSnap.exists) {
                setCurrentUserProfile({ ...docSnap.data(), id: user.uid });
              } else {
                const autoName = user.displayName || user.email?.split('@')[0] || 'Usuario';
                const autoUsername = `@${user.email?.split('@')[0] || 'usuario'}`;
                const recoveryProfile = {
                  id: user.uid,
                  name: autoName,
                  username: autoUsername,
                  email: user.email,
                  userIcon: '🛡️',
                  role: 'parent',
                  avatar: '🛡️',
                  theme: 'unicorns',
                  createdAt: Date.now()
                };
                await db.collection('users').doc(user.uid).set(recoveryProfile);
                setCurrentUserProfile(recoveryProfile);
              }
            } catch (err) {
              console.warn("Aviso al obtener perfil del usuario:", err);
            }
          } else {
            setCurrentUserProfile(null);
          }
          setIsLoading(false);
        });

        return () => unsubAuth();
      }, []);

      // --- SINCRONIZACIÓN EN TIEMPO REAL CON LA BASE DE DATOS ---
      React.useEffect(() => {
        if (!db) return;

        let unsubUsers = () => {};
        let unsubChats = () => {};
        let unsubPosts = () => {};
        let unsubLB = () => {};
        let unsubPQ = () => {};

        try {
          unsubUsers = db.collection('users').onSnapshot(snap => {
            const list = snap.docs.map(doc => ({ ...doc.data(), id: doc.id }));
            setUsers(list);
            if (firebaseUser) {
              const myDoc = list.find(u => u.id === firebaseUser.uid);
              if (myDoc) setCurrentUserProfile(myDoc);
            }
          }, (err) => {
            console.warn("Aviso al leer lista de usuarios:", err.message);
          });

          // Escuchar las demás colecciones si el usuario ya está autenticado
          if (firebaseUser) {
            unsubChats = db.collection('chats').onSnapshot(snap => {
              const list = snap.docs.map(doc => ({ ...doc.data(), id: doc.id }));
              setChats(list);
            }, (err) => console.warn("Aviso al leer chats:", err.message));

            unsubPosts = db.collection('posts').onSnapshot(snap => {
              const list = snap.docs.map(doc => ({ ...doc.data(), id: doc.id }));
              list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
              setPosts(list);
            }, (err) => console.warn("Aviso al leer posts:", err.message));

            unsubLB = db.collection('leaderboard').onSnapshot(snap => {
              const list = snap.docs.map(doc => ({ ...doc.data(), id: doc.id }));
              setLeaderboard(list);
            }, (err) => console.warn("Aviso al leer leaderboard:", err.message));

            unsubPQ = db.collection('parentQueue').onSnapshot(snap => {
              const list = snap.docs.map(doc => ({ ...doc.data(), id: doc.id }));
              setParentPendingQueue(list);
            }, (err) => console.warn("Aviso al leer parentQueue:", err.message));
          }
        } catch (e) {
          console.warn("Error en suscripciones a datos:", e);
        }

        return () => {
          unsubUsers();
          unsubChats();
          unsubPosts();
          unsubLB();
          unsubPQ();
        };
      }, [firebaseUser]);

      // Temporizador de grabación de notas de voz
      React.useEffect(() => {
        if (isRecordingAudio) {
          setRecordingSeconds(0);
          recordTimerRef.current = setInterval(() => {
            setRecordingSeconds(s => s + 1);
          }, 1000);
        } else {
          if (recordTimerRef.current) clearInterval(recordTimerRef.current);
        }
        return () => {
          if (recordTimerRef.current) clearInterval(recordTimerRef.current);
        };
      }, [isRecordingAudio]);

      // Perfil activo garantizado
      const currentUser = currentUserProfile || users.find(u => u.id === firebaseUser?.uid) || null;
      const activeTheme = (currentUser && THEMES[currentUser.theme]) ? THEMES[currentUser.theme] : THEMES.unicorns;

      // --- CERRAR SESIÓN ---
      const handleLogout = async () => {
        SoundFX.playPop();
        try {
          if (auth) await auth.signOut();
        } catch (e) {}
        setCurrentUserProfile(null);
        setFirebaseUser(null);
        setSelectedChatId(null);
        setRawUsernameInput('');
        setLoginPasswordInput('');
        setLoginError('');
        triggerToast('Sesión cerrada correctamente', '🔒');
      };

      // --- TRADUCTOR DE ERRORES AMIGABLE (SIN TECNICISMOS) ---
      const getFriendlyErrorMessage = (err) => {
        if (!err) return 'Ha ocurrido un error inesperado.';
        if (err.code === 'auth/operation-not-allowed') {
          return '⚠️ El acceso con usuario y contraseña está desactivado. Habilítalo en el panel.';
        }
        if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
          return 'Contraseña o usuario incorrecto. Inténtalo de nuevo.';
        }
        if (err.code === 'auth/user-not-found') {
          return 'Usuario no encontrado. Asegúrate de haber creado tu cuenta primero.';
        }
        if (err.code === 'auth/email-already-in-use') {
          return 'Ese nombre de usuario ya está registrado. Por favor elige otro.';
        }
        if (err.code === 'auth/weak-password') {
          return 'La contraseña debe tener un mínimo de 6 caracteres.';
        }
        if (err.code === 'auth/invalid-email') {
          return 'Formato de usuario no válido. Usa únicamente letras, números y guiones bajos.';
        }
        if (err.code === 'permission-denied') {
          return '⚠️ Permiso denegado al guardar los datos.';
        }
        return err.message || 'Error de conexión. Inténtalo de nuevo.';
      };

      // --- INICIAR SESIÓN ---
      const handleLoginSubmit = async (e) => {
        if (e) e.preventDefault();
        setLoginError('');

        const usernameToAuth = rawUsernameInput.trim();

        if (!usernameToAuth) {
          setLoginError('Por favor introduce tu nombre de usuario');
          return;
        }

        if (!loginPasswordInput) {
          setLoginError('Por favor introduce tu contraseña');
          return;
        }

        if (loginPasswordInput.length < 6) {
          setLoginError('La contraseña debe tener al menos 6 caracteres');
          return;
        }

        setIsAuthenticating(true);
        const internalEmail = usernameToFakeEmail(usernameToAuth);

        try {
          const cred = await auth.signInWithEmailAndPassword(internalEmail, loginPasswordInput.trim());
          SoundFX.playSuccess();

          if (db) {
            const userDoc = await db.collection('users').doc(cred.user.uid).get();
            if (userDoc.exists) {
              setCurrentUserProfile({ ...userDoc.data(), id: cred.user.uid });
            } else {
              const cleanUsername = `@${usernameToAuth.replace(/@/g, '').toLowerCase()}`;
              const fallback = {
                id: cred.user.uid,
                name: cleanUsername.replace('@', ''),
                username: cleanUsername,
                email: internalEmail,
                userIcon: '🛡️',
                role: 'parent',
                avatar: '🛡️',
                theme: 'unicorns',
                createdAt: Date.now()
              };
              await db.collection('users').doc(cred.user.uid).set(fallback);
              setCurrentUserProfile(fallback);
            }
          }

          setLoginPasswordInput('');
          setRawUsernameInput('');
          setLoginError('');
          triggerToast('¡Bienvenido a FriendsAndFamily!', '🎉');
        } catch (err) {
          console.error("Error al iniciar sesión:", err);
          setLoginError(getFriendlyErrorMessage(err));
          SoundFX.playPop();
        } finally {
          setIsAuthenticating(false);
        }
      };

      // --- CREAR CUENTA NUEVA (INDEPENDIENTE Y SEGURA) ---
      const handleCreateMember = async (e) => {
        if (e) e.preventDefault();
        setModalError('');

        const cleanRaw = (newMemberForm.rawUsername || '').toLowerCase().replace(/@/g, '').replace(/[^a-z0-9_.-]/g, '').trim();

        if (!newMemberForm.name.trim() || !cleanRaw) {
          setModalError('Por favor completa el nombre y el usuario');
          return;
        }

        if (newMemberForm.password.trim().length < 6) {
          setModalError('La contraseña debe tener al menos 6 caracteres');
          return;
        }

        const fullUsername = `@${cleanRaw}`;
        const internalEmail = usernameToFakeEmail(cleanRaw);
        setIsAuthenticating(true);

        try {
          // Si el padre ya tiene una sesión iniciada, creamos el miembro mediante instancia secundaria
          // para no cerrar ni alterar la sesión actual del padre
          if (currentUser) {
            const secAuth = getSecondaryAuthInstance();
            const userCredential = await secAuth.createUserWithEmailAndPassword(internalEmail, newMemberForm.password.trim());
            const newUid = userCredential.user.uid;

            const newUserData = {
              id: newUid,
              name: newMemberForm.name.trim(),
              username: fullUsername,
              email: internalEmail,
              userIcon: newMemberForm.userIcon || '🚀',
              role: newMemberForm.role,
              avatar: newMemberForm.userIcon || '🚀',
              theme: newMemberForm.theme || 'unicorns',
              createdAt: Date.now()
            };

            if (newMemberForm.role === 'minor') {
              newUserData.parentIds = currentUser.role === 'parent' ? [currentUser.id] : [];
            } else if (newMemberForm.role === 'parent') {
              newUserData.childrenIds = [];
            } else if (newMemberForm.role === 'relative') {
              newUserData.relation = newMemberForm.relation.trim() || 'Familiar';
            }

            await db.collection('users').doc(newUid).set(newUserData);

            if (newMemberForm.role === 'minor' && currentUser.role === 'parent') {
              const updatedChildren = [...(currentUser.childrenIds || []), newUid];
              await db.collection('users').doc(currentUser.id).update({
                childrenIds: updatedChildren
              });
              setCurrentUserProfile(prev => prev ? { ...prev, childrenIds: updatedChildren } : prev);
            }

            await secAuth.signOut();
            SoundFX.playSuccess();
            triggerToast(`¡Cuenta de ${newUserData.name} (${newUserData.username}) creada con éxito!`, '🎉');
          } else {
            // Si nos encontramos en la pantalla de bienvenida/login, registramos y entramos directamente
            const userCredential = await auth.createUserWithEmailAndPassword(internalEmail, newMemberForm.password.trim());
            const newUid = userCredential.user.uid;

            const newUserData = {
              id: newUid,
              name: newMemberForm.name.trim(),
              username: fullUsername,
              email: internalEmail,
              userIcon: newMemberForm.userIcon || '🛡️',
              role: newMemberForm.role,
              avatar: newMemberForm.userIcon || '🛡️',
              theme: newMemberForm.theme || 'unicorns',
              createdAt: Date.now()
            };

            if (newMemberForm.role === 'parent') {
              newUserData.childrenIds = [];
            }

            await db.collection('users').doc(newUid).set(newUserData);
            setCurrentUserProfile(newUserData);
            SoundFX.playSuccess();
            triggerToast(`¡Bienvenido/a, ${newUserData.name}!`, '🎉');
          }

          setShowAddMemberModal(false);
          setModalError('');
          setNewMemberForm({
            name: '',
            rawUsername: '',
            password: '',
            role: currentUser ? 'minor' : 'parent',
            userIcon: currentUser ? '🚀' : '🛡️',
            theme: 'unicorns',
            relation: ''
          });
        } catch (err) {
          console.error("Error al registrar cuenta:", err);
          setModalError(getFriendlyErrorMessage(err));
          SoundFX.playPop();
        } finally {
          setIsAuthenticating(false);
        }
      };

      // --- CAMBIO DE TEMA VISUAL ---
      const handleThemeChange = async (newThemeKey) => {
        if (!currentUser || !db) return;
        SoundFX.playPop();
        try {
          await db.collection('users').doc(currentUser.id).update({ theme: newThemeKey });
          setCurrentUserProfile(prev => prev ? { ...prev, theme: newThemeKey } : prev);
        } catch (e) {
          console.error("Error al actualizar tema:", e);
        }
      };

      // --- GUARDAR PUNTUACIÓN DE FLAPPY UNICORN ---
      const handleUpdateScore = async (score) => {
        if (!currentUser || !db) return;
        const existing = leaderboard.find(item => item.userId === currentUser.id);
        if (!existing || score > existing.score) {
          try {
            await db.collection('leaderboard').doc(currentUser.id).set({
              userId: currentUser.id,
              score,
              updatedAt: Date.now()
            }, { merge: true });
          } catch (e) {
            console.error("Error al guardar puntuación:", e);
          }
        }
      };

      // --- GUARDAR DIBUJO DEL MUSEO ---
      const handleSaveDrawing = async ({ title, description, imageUrl }) => {
        if (!currentUser || !db) return;
        const newPostId = `p_${Date.now()}`;
        const newPost = {
          id: newPostId,
          authorId: currentUser.id,
          title,
          description,
          status: 'pending',
          timestamp: 'Justo ahora',
          createdAt: Date.now(),
          likes: [],
          stickers: ['🎨'],
          imageUrl,
          comments: []
        };

        const newQueueId = `req_post_${Date.now()}`;
        const newQueueItem = {
          id: newQueueId,
          type: 'post_approval',
          childId: currentUser.id,
          postId: newPostId,
          title: newPost.title,
          timestamp: 'Justo ahora'
        };

        try {
          await db.collection('posts').doc(newPostId).set(newPost);
          await db.collection('parentQueue').doc(newQueueId).set(newQueueItem);
          setShowPainter(false);
          SoundFX.playSuccess();
          triggerToast('¡Obra enviada a supervisión!', '🎨');
        } catch (e) {
          console.error("Error al guardar obra:", e);
          triggerToast('Error al enviar la obra', '⚠️');
        }
      };

      // --- REACCIONES EN EL MUSEO ---
      const handleAddSticker = async (postId, sticker) => {
        if (!currentUser || !db) return;
        SoundFX.playPop();
        const targetPost = posts.find(p => p.id === postId);
        if (!targetPost) return;

        const hasLiked = (targetPost.likes || []).includes(currentUser.id);
        const newLikes = hasLiked
          ? targetPost.likes.filter(id => id !== currentUser.id)
          : [...(targetPost.likes || []), currentUser.id];
        const newStickers = (targetPost.stickers || []).includes(sticker)
          ? targetPost.stickers
          : [...(targetPost.stickers || []), sticker];

        try {
          await db.collection('posts').doc(postId).update({
            likes: newLikes,
            stickers: newStickers
          });
        } catch (e) {
          console.error("Error al añadir reacción:", e);
        }
      };

      // --- COMENTARIOS EN EL MUSEO ---
      const handleAddComment = async (postId, text) => {
        if (!currentUser || !db || !text || !text.trim()) return;
        SoundFX.playPop();
        const targetPost = posts.find(p => p.id === postId);
        if (!targetPost) return;

        const newComment = {
          id: `c_${Date.now()}`,
          authorId: currentUser.id,
          text: text.trim(),
          time: 'Ahora'
        };
        const updatedComments = [...(targetPost.comments || []), newComment];

        try {
          await db.collection('posts').doc(postId).update({
            comments: updatedComments
          });
          setCommentInputs(prev => ({ ...prev, [postId]: '' }));
        } catch (e) {
          console.error("Error al comentar:", e);
        }
      };

      // --- ENVIAR MENSAJE DE TEXTO O AUDIO ---
      const handleSendMessage = async (text = null, isAudio = false, audioBase64 = null) => {
        if (!selectedChatId || !currentUser || !db) return;
        const msgText = text !== null ? text : messageInput;
        if (!isAudio && !msgText.trim()) return;

        SoundFX.playPop();
        const targetChat = chats.find(c => c.id === selectedChatId);
        if (!targetChat) return;

        const newMessage = {
          id: `m_${Date.now()}`,
          senderId: currentUser.id,
          text: isAudio ? '' : msgText,
          isAudio,
          audioData: audioBase64 || null,
          duration: isAudio ? Math.max(2, recordingSeconds) : null,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        const updatedMessages = [...(targetChat.messages || []), newMessage];
        const unreadBy = { ...(targetChat.unreadBy || {}) };
        (targetChat.participants || []).forEach(pid => {
          if (pid !== currentUser.id) {
            unreadBy[pid] = (unreadBy[pid] || 0) + 1;
          }
        });

        try {
          await db.collection('chats').doc(selectedChatId).update({
            messages: updatedMessages,
            unreadBy
          });
          if (!isAudio) setMessageInput('');
        } catch (e) {
          console.error("Error al enviar mensaje:", e);
        }
      };

      const handleSendSticker = (emoji) => handleSendMessage(emoji, false);

      // --- GRABACIÓN DE AUDIO REAL CON MICRÓFONO ---
      const startRealAudioRecording = async () => {
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mediaRecorder = new MediaRecorder(stream);
            mediaRecorderRef.current = mediaRecorder;
            audioChunksRef.current = [];

            mediaRecorder.ondataavailable = (e) => {
              if (e.data.size > 0) audioChunksRef.current.push(e.data);
            };

            mediaRecorder.onstop = () => {
              const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
              const reader = new FileReader();
              reader.readAsDataURL(audioBlob);
              reader.onloadend = () => {
                handleSendMessage('', true, reader.result);
              };
              stream.getTracks().forEach(track => track.stop());
            };

            mediaRecorder.start();
            setIsRecordingAudio(true);
            SoundFX.playPop();
          } else {
            setIsRecordingAudio(true);
          }
        } catch (err) {
          setIsRecordingAudio(true);
        }
      };

      const stopRealAudioRecording = () => {
        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
          mediaRecorderRef.current.stop();
        } else {
          handleSendMessage('', true, null);
        }
        setIsRecordingAudio(false);
        SoundFX.playSuccess();
      };

      // --- SOLICITAR APERTURA DE NUEVO CHAT ---
      const handleRequestNewChat = async (targetId) => {
        if (!targetId || !currentUser || !db) return;
        const targetUser = users.find(u => u.id === targetId);

        // Si ya existe una conversación con esta persona (aprobada o pendiente), redirigir directamente
        const existing = chats.find(c =>
          (c.participants || []).includes(currentUser.id) && (c.participants || []).includes(targetId)
        );
        if (existing) {
          triggerToast(`Ya tienes una conversación con ${targetUser?.name || 'este contacto'}`, '💬');
          setShowRequestChatModal(false);
          setSelectedChatId(existing.id);
          setActiveTab('chats');
          return;
        }

        const newChatId = `c_${currentUser.id}_${targetId}_${Date.now()}`;
        const newReqId = `req_chat_${newChatId}`;

        // Crear el chat en estado pendiente para que aparezca de inmediato como 'Solicitada'
        const newChat = {
          id: newChatId,
          participants: [currentUser.id, targetId],
          title: targetUser?.name || 'Contacto',
          approvedByParent: false,
          status: 'pending',
          requestedBy: currentUser.id,
          targetUserId: targetId,
          createdAt: Date.now(),
          unreadBy: {},
          messages: [
            {
              id: `m_pending_${Date.now()}`,
              senderId: 'system',
              text: '⏳ Solicitud de chat enviada. Esperando la aprobación de los padres para comenzar a conversar.',
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              isAudio: false
            }
          ]
        };

        const newReq = {
          id: newReqId,
          type: 'new_chat_permission',
          chatId: newChatId,
          childId: currentUser.id,
          targetUserId: targetId,
          reason: `${currentUser.name} solicita abrir chat con ${targetUser?.name || 'contacto'}.`,
          timestamp: 'Ahora'
        };

        try {
          await db.collection('chats').doc(newChatId).set(newChat);
          await db.collection('parentQueue').doc(newReqId).set(newReq);
          SoundFX.playSuccess();
          triggerToast(`Solicitud enviada para abrir chat con ${targetUser?.name}. Ya aparece en tus chats.`, '⏳');
          setShowRequestChatModal(false);
          setSelectedChatId(newChatId);
          setActiveTab('chats');
        } catch (e) {
          console.error("Error al solicitar chat:", e);
        }
      };

      // --- APROBACIÓN PARENTAL ---
      const handleApproveParentRequest = async (request) => {
        if (!db) return;
        SoundFX.playSuccess();
        if (request.type === 'new_chat_permission') {
          const chatId = request.chatId;
          try {
            if (chatId) {
              const chatDoc = await db.collection('chats').doc(chatId).get();
              const existingMessages = (chatDoc.exists && chatDoc.data().messages) ? chatDoc.data().messages : [];
              const approvedMsg = {
                id: `m_init_${Date.now()}`,
                senderId: currentUser.id,
                text: '🛡️ Conversación autorizada por los padres. ¡A comunicarse con respeto y cariño!',
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                isAudio: false
              };
              await db.collection('chats').doc(chatId).update({
                approvedByParent: true,
                status: 'approved',
                messages: [...existingMessages, approvedMsg]
              });
            } else {
              // Respaldo para solicitudes anteriores
              const target = users.find(u => u.id === request.targetUserId);
              const newChatId = `c_${request.childId}_${request.targetUserId}_${Date.now()}`;
              const newChat = {
                id: newChatId,
                participants: [request.childId, request.targetUserId],
                title: `${target?.name || 'Contacto'}`,
                approvedByParent: true,
                status: 'approved',
                unreadBy: {},
                messages: [
                  {
                    id: `m_init_${Date.now()}`,
                    senderId: currentUser.id,
                    text: '🛡️ Conversación autorizada. ¡A comunicarse con respeto y cariño!',
                    time: 'Ahora',
                    isAudio: false
                  }
                ]
              };
              await db.collection('chats').doc(newChatId).set(newChat);
            }
            await db.collection('parentQueue').doc(request.id).delete();
          } catch (e) {
            console.error("Error al aprobar chat:", e);
          }
        } else if (request.type === 'post_approval') {
          try {
            await db.collection('posts').doc(request.postId).update({ status: 'approved' });
            await db.collection('parentQueue').doc(request.id).delete();
          } catch (e) {}
        }
        triggerToast('Solicitud aprobada con éxito', '✅');
      };

      const handleRejectParentRequest = async (requestId, postId = null, chatId = null) => {
        if (!db) return;
        SoundFX.playPop();
        try {
          if (postId) await db.collection('posts').doc(postId).delete();
          if (chatId) await db.collection('chats').doc(chatId).delete();
          await db.collection('parentQueue').doc(requestId).delete();
        } catch (e) {}
        triggerToast('Solicitud descartada', '🗑️');

      const handleOpenChat = async (chatId) => {
        SoundFX.playPop();
        setSelectedChatId(chatId);
        if (!currentUser || !db) return;

        try {
          await db.collection('chats').doc(chatId).update({
            [`unreadBy.${currentUser.id}`]: 0
          });

      };

      // --- REGLAS DE PRIVACIDAD ---
      const visibleChats = chats.filter(chat => {
        if (!currentUser) return false;
        if (currentUser.role === 'parent') {
          const myChildrenIds = currentUser.childrenIds || [];
          const isOwnChat = (chat.participants || []).includes(currentUser.id);
          const isChildChat = (chat.participants || []).some(pId => myChildrenIds.includes(pId));
          return isOwnChat || isChildChat;
        }
        return (chat.participants || []).includes(currentUser.id);

      const visiblePosts = posts.filter(post => {
        if (!currentUser) return false;
        if (currentUser.role === 'parent') return true;

        return post.authorId === currentUser.id;

      const getUnreadCount = (chat) => {
        return (currentUser && chat.unreadBy && chat.unreadBy[currentUser.id]) || 0;
      };

      const totalUnreadChatsCount = visibleChats.reduce((sum, c) => sum + (getUnreadCount(c) > 0 ? 1 : 0), 0);
      const activeChatObj = chats.find(c => c.id === selectedChatId);

      const getChatSupervisionDetails = (chat) => {
        if (!currentUser || currentUser.role !== 'parent') return null;
        const isOwn = (chat.participants || []).includes(currentUser.id);

        }
        if (childParticipant) {

        return { type: 'supervised', label: 'Supervisión General', badgeBg: 'bg-slate-100 text-slate-700 border-slate-300' };

      // --- PANTALLA DE CARGA ---
      if (isLoading) {

                  className="w-full p-2.5 rounded-xl border border-slate-300 font-semibold bg-white"
                >
                  <option value="parent">Padre / Madre / Tutor</option>
                  <option value="minor">Hijo/a (Menor a cargo)</option>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Nombre completo:</label>

                />

              <div>
                <label className="font-bold text-slate-700 block mb-1">Nombre de usuario:</label>

                  <span className="absolute left-3.5 font-black text-purple-600 text-sm select-none pointer-events-none">@</span>
                  <input
                    type="text"

                    onChange={(e) => {

                      setNewMemberForm({ ...newMemberForm, rawUsername: clean });

              </div>

              <div>

              {newMemberForm.role === 'relative' && (

              <div>
                <label className="font-bold text-slate-700 block mb-1">Icono de perfil:</label>
                <div className="flex gap-2 flex-wrap">
                  {['🛡️', '🚀', '🦄', '⚽', '🎨', '🌟', '🐾', '🐱', '💖'].map(ic => (
                    <button
                      type="button"
                      key={ic}
                      onClick={() => setNewMemberForm({ ...newMemberForm, userIcon: ic })}
                      className={`w-9 h-9 rounded-xl text-lg flex items-center justify-center border transition ${newMemberForm.userIcon === ic ? 'border-purple-600 bg-purple-100 scale-110 ring-2 ring-purple-300' : 'bg-slate-50 hover:bg-slate-100'}`}
                    >
                      {ic}
                    </button>
                  ))}
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <button
                  type="button"
                  onClick={() => setShowAddMemberModal(false)}
                  className="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl font-bold"
                >Cancelar</button>
                <button
                  type="submit"
                  disabled={isAuthenticating}
                  className="px-5 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-bold shadow-md transition"
                >
                  {isAuthenticating ? 'Creando...' : (currentUser ? 'Crear Miembro' : 'Guardar y Entrar')}
                </button>
              </div>
            </form>
          </div>
        </div>
      ) : null;

      // --- PANTALLA DE ACCESO (CUANDO NO HAY SESIÓN ACTIVA) ---
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 flex items-center justify-center p-4 select-none relative">
            {ToastElement}
            {AddMemberModalElement}

            <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl border-4 border-purple-200 text-center relative">
              <div className="flex justify-center mb-3">
                <LayeredBrandIcon />
              </div>
              <h1 className="text-2xl font-black text-slate-800">
                Friends<span className="text-pink-500">And</span>Family
              </h1>

              {/* Si existía una sesión anterior pendiente */}
              {firebaseUser && !currentUser && (

                  <button

                  >

                  </button>

              )}

              <form onSubmit={handleLoginSubmit} className="mt-5 space-y-4 text-left">
                <div>
                  <label className="text-xs font-bold text-slate-700 block mb-1">

                  </label>
                  <div className="relative flex items-center">
                    <span className="absolute left-3.5 font-black text-purple-600 text-sm select-none pointer-events-none">@</span>
                    <input
                      type="text"
                      value={rawUsernameInput}
                      onChange={(e) => {
                        const clean = e.target.value.replace(/@/g, '').toLowerCase().replace(/[^a-z0-9_.-]/g, '');
                        setRawUsernameInput(clean);

                  <div className="relative">

                    <button

                <button

                  <button

                      });
                      setModalError('');

                    }}
                    className="text-xs font-bold text-purple-700 hover:text-purple-900 transition flex items-center justify-center gap-1 mx-auto"

                    <span>➕</span> Crear nueva cuenta
                  </button>

              </form>
            </div>
          </div>
        );
      }

      // --- APP PRINCIPAL (CON SESIÓN INICIADA) ---
      return (
        <div className={`min-h-screen bg-gradient-to-br ${activeTheme.bgGradient} flex flex-col transition-colors duration-500 relative overflow-hidden`}>
          {ToastElement}
          {AddMemberModalElement}

          {/* Iconos flotantes del tema de fondo */}
          <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">

          </div>

          {/* Barra Superior */}
          <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-purple-200/80 shadow-sm px-4 py-3 relative">
            <div className="max-w-6xl mx-auto flex items-center justify-between gap-3">

              {/* Logo */}
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('museum')}>
                <LayeredBrandIcon />
                <div className="flex items-center gap-2">
                  <h1 className="text-xl font-black tracking-tight text-slate-800 flex items-center gap-1">
                    Friends<span className="text-pink-500">And</span>Family
                  </h1>
                </div>
              </div>

              {/* Usuario activo y Cerrar Sesión */}
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2 bg-purple-50 px-3 py-1.5 rounded-2xl border border-purple-200">
                  <span className="text-xl">{currentUser.userIcon || currentUser.avatar}</span>
                  <div className="text-left hidden sm:block">

              <button
                onClick={() => { SoundFX.playPop(); setActiveTab('parent_tray'); }}
                className={`flex flex-col items-center p-1 rounded-xl text-xs font-bold transition relative ${activeTab === 'parent_tray' ? 'text-red-600' : 'text-slate-400'}`}
              >
                <span className="text-xl">🛡️</span>
                <span className="text-[10px]">Supervisión</span>
                {parentPendingQueue.length > 0 && (
                  <span className="absolute top-0 right-1 w-2.5 h-2.5 bg-red-500 rounded-full animate-ping"></span>
                )}
              </button>
            ) : (
              <button
                onClick={() => { SoundFX.playPop(); setActiveTab('settings'); }}
                className={`flex flex-col items-center p-1 rounded-xl text-xs font-bold transition ${activeTab === 'settings' ? 'text-purple-600' : 'text-slate-400'}`}
              >
                <span className="text-xl">🎨</span>
                <span className="text-[10px]">Fondo</span>
              </button>
            )}

            <button
              onClick={handleLogout}
              className="flex flex-col items-center p-1 rounded-xl text-xs font-bold text-red-500 transition"
              title="Cerrar Sesión"
            >
              <span className="text-xl">🔒</span>
              <span className="text-[10px]">Salir</span>
            </button>
          </nav>

          {/* Modal del Juego Flappy Unicorn */}
          {showFullscreenGame && (
            <FullscreenFlappyUnicorn
              currentUser={currentUser}
              leaderboard={leaderboard}
              onUpdateScore={handleUpdateScore}
              onClose={() => setShowFullscreenGame(false)}
            />
          )}

          {/* Modal del Taller de Dibujo */}
          {showPainter && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <MiniCanvasPainter
                onSave={handleSaveDrawing}
                onCancel={() => setShowPainter(false)}
              />
            </div>
          )}

          {/* Modal de Solicitud de Chat */}
          {showRequestChatModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border-4 border-purple-200">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="text-lg font-bold text-purple-900 flex items-center gap-2">
                    <span>💬</span> Abrir Conversación
                  </h3>
                  <button onClick={() => setShowRequestChatModal(false)} className="text-slate-400 text-lg">✕</button>
                </div>
                <div className="space-y-2 mb-4">
                  <label className="text-xs font-bold text-slate-700 block">Selecciona el contacto:</label>
                  <select
                    className="w-full p-2.5 rounded-xl border border-slate-300 text-sm font-semibold"
                    onChange={(e) => setRequestChatTarget(e.target.value)}
                    defaultValue=""
                  >
                    <option value="" disabled>Selecciona un contacto...</option>
                    {users
                      .filter(u => u.id !== currentUser.id)
                      .map(u => {
                        const hasChat = chats.some(c => (c.participants || []).includes(currentUser.id) && (c.participants || []).includes(u.id));
                        return (
                          <option key={u.id} value={u.id}>
                            {u.name} {u.username ? `(${u.username})` : ''} {hasChat ? '• (Ya existe conversación)' : ''}
                          </option>
                        );
                      })}
                  </select>
                </div>
                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => setShowRequestChatModal(false)}
                    className="px-4 py-2 rounded-xl bg-slate-100 text-xs font-bold text-slate-600"
                  >Cancelar</button>
                  <button
                    onClick={() => handleRequestNewChat(requestChatTarget)}
                    className="px-4 py-2 rounded-xl bg-purple-600 text-white text-xs font-bold shadow"
                  >
                    Abrir o Solicitar
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
